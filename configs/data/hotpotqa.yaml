# HotpotQA distractor (multi-hop QA with 10-paragraph context;
# 90k train / 7.4k validation-as-test).
# Run once before using this config:
#   python -m atgen.utils.data.preprocess_hotpotqa --out cache/hotpotqa_preprocessed
# (Flattens the 10-paragraph context into a single prompt string and keeps the
# gold answer. See src/atgen/utils/data/preprocess_hotpotqa.py.)
#
# Headline metric is `token_f1` (SQuAD-style), with `exact_match` as a stricter
# secondary signal. Same metric setup as MuSiQue.

dataset: 'cache/hotpotqa_preprocessed'
input_column_name: 'input'
output_column_name: 'answer'
unlabeled_data_split_name: train
test_split_name: test
train_subset_size: null
test_subset_size: 1_000
input_max_length: 8192
output_max_length: 64
fetch_kwargs: {}
is_in_conversational_format: false
system_prompt: |
    Answer the question using only the information in the provided paragraphs. The answer must be a short, exact span (a name, number, or phrase). Do not explain, do not write a full sentence.
assistant_response_start: ${model.assistant_response_start}
use_test_benchmark: false
task: 'open-qa'
