hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${experiment_name}_${now:%H-%M-%S}
  sweep:
    dir: ${output_dir}/${now:%Y-%m-%d}/${experiment_name}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}


defaults:
  - labeller: golden
  - data: aeslc
  - al: random
  - _self_

experiment_name: ${al.strategy}
name: base
output_dir: outputs
offline_mode: False
cache_dir: cache
save_model: False
seed: 42
al:
    # Strategy configuration now loaded from configs/al/<strategy>.yaml
    # Other AL settings that aren't strategy-specific
    init_query_size: 10
    query_size: 10
    num_iterations: 5
    eval_zero_iteration: True
    subsample_size: -1
    required_performance:
        rouge1: 0.5
    budget:

model:
    checkpoint: Qwen/Qwen3-1.7B
    quantize: False
    model_max_length: ${multiply_with_few_shot:${data.input_max_length},${data.few_shot.count}}
    dtype: bfloat16
    save_in_fp_32: false
    assistant_response_start: "<think>\n\n</think>\n\n"
    peft:
        use: True
        r: 32
        lora_alpha: 32
        lora_dropout: 0.
        bias: 'none'
        seed: ${seed}
        use_gradient_checkpointing: 'unsloth'
        modules:

training:
    dev_split_size: 0.2
    hyperparameters:
        num_epochs: 15
        train_batch_size: 8
        eval_batch_size: 4
        gradient_accumulation_steps: 2
        lr: 0.00003
        warmup_ratio: 0.03
        weight_decay: 0.01
        max_grad_norm: 1.
        early_stopping_patience: 3
        model_max_length: ${model.model_max_length}
        dataset_num_proc: ${data.num_proc}
        packing: False
        lr_scheduler_type: linear
        gradient_checkpointing: True


inference:
    framework: 'vllm'
    max_new_tokens: ${data.output_max_length}
    batch_size: 8
    gpu_memory_utilization: 0.5
    top_p: 0.1
    temperature: 0.6
    model: ${model.checkpoint}
    num_display_generations: 5
    num_threads_for_bfcl: 32

evaluation:
    additional_metrics: []
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key:
    model: nebius/Qwen/Qwen3-235B-A22B
    deepeval_threshold: 0.5
    deepeval_include_reason: False
    deepeval_strict_mode: False
    deepeval_async_mode: True
    deepeval_verbose_mode: False
    deepeval_truths_extraction_limit: 10
