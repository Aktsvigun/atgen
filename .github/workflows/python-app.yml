# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        chmod +x install.sh
        pip install -e .
        ./install.sh
        pip install flake8 pytest
    - name: Test with pytest
      run: |
        pytest
    - name: Lint
      uses: py-actions/flake8@v2
      with:
        # TODO remove src/atgen/strategies/idds.py,src/atgen/strategies/nsp.py,src/atgen/strategies/bleuvar.py from --extend-exclude when we fix it
        args: "--extend-ignore E501,F405,F403,E203 --per-file-ignores __init__.py:F401 --extend-exclude src/atgen/metrics/AlignScore,src/atgen/metrics/summac,src/atgen/strategies/idds.py,src/atgen/strategies/nsp.py,src/atgen/strategies/bleuvar.py"
        path: "src pages"
        plugins: "flake8-black"
